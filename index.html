<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hacer Cosmética — Insumos Cosméticos</title>
  <style>
    :root {
      --bg: #faf7f9;
      --card: #ffffff;
      --text: #231f20;
      --muted: #6b6268;
      --accent: #7c3aed;
      --accent-dark: #5b21b6;
      --border: #e8e0e6;
      --whatsapp: #16a34a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; }
    header {
      background: linear-gradient(135deg, #4c1d95, #7c3aed);
      color: #fff;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    header h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    header p { opacity: 0.92; font-size: 0.98rem; max-width: 620px; margin: 0 auto; }
    .container { max-width: 1040px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.15rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-dark);
      background: #ede9fe;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      margin-bottom: 0.5rem;
    }
    .card h3 { font-size: 1.08rem; margin-bottom: 0.35rem; }
    .card p { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; }
    select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.85rem;
      background: #fff;
      font-size: 0.9rem;
    }
    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }
    .price { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .btn-wa {
      display: block;
      text-align: center;
      text-decoration: none;
      background: var(--whatsapp);
      color: #fff;
      font-weight: 600;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      font-size: 0.92rem;
    }
    .btn-wa:hover { filter: brightness(0.95); }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding: 1.5rem 1rem 2.5rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Hacer Cosmética — Insumos</h1>
    <p>Materias primas seleccionadas para formulación cosmética artesanal y profesional. Selecciona tu presentación y pide directo por WhatsApp.</p>
  </header>

  <main class="container">
    <div class="filters" id="filters"></div>
    <div class="grid" id="catalog"></div>
  </main>

  <footer>
    Hacer Cosmética · Catálogo de Insumos Cosméticos
  </footer>

  <script>
    // CAMBIA ESTE NÚMERO POR TU WHATSAPP CON CÓDIGO DE PAÍS (sin + ni espacios, ej: 584120000000)
    const WHATSAPP_NUMBER = "584120000000";

    const PRODUCTS = [
      {
        id: "coco-betaina",
        name: "Coco-betaína",
        category: "Tensioactivos",
        description: "Tensioactivo anfótero suave para shampoos, geles limpiadores y formulaciones capilares o corporales.",
        options: [
          { label: "250 g", price: "$5.00" },
          { label: "500 g", price: "$9.00" },
          { label: "1 kg", price: "$16.50" }
        ]
      },
      {
        id: "niacinamida",
        name: "Niacinamida (Vitamina B3)",
        category: "Activos",
        description: "Activo cosmético hidrosoluble versátil para sérums, cremas faciales y tónicos.",
        options: [
          { label: "50 g", price: "$6.50" },
          { label: "100 g", price: "$11.50" }
        ]
      },
      {
        id: "goma-xantana",
        name: "Goma Xantana",
        category: "Espesantes y Gomas",
        description: "Biopolímero espesante y estabilizante de fase acuosa para geles, emulsiones y suspensiones.",
        options: [
          { label: "100 g", price: "$4.50" },
          { label: "250 g", price: "$9.50" }
        ]
      },
      {
        id: "alantoina",
        name: "Alantoína",
        category: "Activos",
        description: "Ingrediente calmante y acondicionador cutáneo ideal para pieles sensibles y post-exposición.",
        options: [
          { label: "50 g", price: "$4.00" },
          { label: "100 g", price: "$7.20" }
        ]
      }
    ];

    const categories = ["Todos", ...new Set(PRODUCTS.map(p => p.category))];
    let activeCategory = "Todos";

    const filtersEl = document.getElementById("filters");
    const catalogEl = document.getElementById("catalog");

    function renderFilters() {
      filtersEl.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === activeCategory ? "active" : ""}" onclick="setCategory('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    window.setCategory = function(cat) {
      activeCategory = cat;
      renderFilters();
      renderCatalog();
    };

    function updateCard(idx) {
      const selectEl = document.getElementById(`opt-${idx}`);
      const priceEl = document.getElementById(`price-${idx}`);
      const linkEl = document.getElementById(`wa-${idx}`);
      const prod = filteredProducts()[idx];
      const chosen = prod.options[selectEl.selectedIndex];

      priceEl.textContent = chosen.price;
      const msg = `Hola Hacer Cosmética, me gustaría consultar disponibilidad y pedido de: ${prod.name} (${chosen.label} - ${chosen.price}).`;
      linkEl.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
    }
    window.updateCard = updateCard;

    function filteredProducts() {
      return activeCategory === "Todos"
        ? PRODUCTS
        : PRODUCTS.filter(p => p.category === activeCategory);
    }

    function renderCatalog() {
      const list = filteredProducts();
      catalogEl.innerHTML = list.map((prod, idx) => {
        const firstOpt = prod.options[0];
        const defaultMsg = encodeURIComponent(
          `Hola Hacer Cosmética, me gustaría consultar disponibilidad y pedido de: ${prod.name} (${firstOpt.label} - ${firstOpt.price}).`
        );
        return `
          <article class="card">
            <div>
              <span class="badge">${prod.category}</span>
              <h3>${prod.name}</h3>
              <p>${prod.description}</p>
            </div>
            <div>
              <label for="opt-${idx}">Presentación</label>
              <select id="opt-${idx}" onchange="updateCard(${idx})">
                ${prod.options.map(o => `<option value="${o.label}">${o.label}</option>`).join("")}
              </select>
              <div class="price-row">
                <span style="font-size:0.85rem;color:#6b6268;">Referencia:</span>
                <span class="price" id="price-${idx}">${firstOpt.price}</span>
              </div>
              <a class="btn-wa" id="wa-${idx}" target="_blank" rel="noopener"
                 href="https://wa.me/${WHATSAPP_NUMBER}?text=${defaultMsg}">
                Pedir por WhatsApp
              </a>
            </div>
          </article>
        `;
      }).join("");
    }

    renderFilters();
    renderCatalog();
  </script>
</body>
</html>
