<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hacer Cosmética — Insumos Cosméticos</title>
  <style>
    :root {
      --bg: #faf7f9;
      --card: #ffffff;
      --text: #231f20;
      --muted: #6b6268;
      --accent: #7c3aed;
      --accent-dark: #5b21b6;
      --border: #e8e0e6;
      --whatsapp: #16a34a;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 5.5rem; }
    header {
      background: linear-gradient(135deg, #4c1d95, #7c3aed);
      color: #fff;
      padding: 2rem 1.25rem;
      text-align: center;
    }
    header h1 { font-size: 1.75rem; margin-bottom: 0.35rem; }
    header p { opacity: 0.92; font-size: 0.98rem; max-width: 640px; margin: 0 auto; }
    .container { max-width: 1040px; margin: 0 auto; padding: 1.5rem 1rem 2rem; }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.15rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-dark);
      background: #ede9fe;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      margin-bottom: 0.5rem;
    }
    .card h3 { font-size: 1.08rem; margin-bottom: 0.35rem; }
    .card p { font-size: 0.88rem; color: var(--muted); margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 0.3rem; }
    select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 0.85rem;
      background: #fff;
      font-size: 0.9rem;
    }
    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.85rem;
    }
    .price { font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .btn-add {
      width: 100%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      padding: 0.68rem 0.9rem;
      border-radius: 10px;
      font-size: 0.92rem;
      cursor: pointer;
    }
    .btn-add:hover { background: var(--accent-dark); }
    .toast {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: #1f2937;
      color: #fff;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      box-shadow: 0 6px 18px rgba(0,0,0,0.18);
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.25s ease;
      pointer-events: none;
      z-index: 60;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    /* Barra flotante del carrito */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      padding: 0.8rem 1rem;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
      z-index: 40;
    }
    .cart-bar-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .cart-summary { font-size: 0.92rem; }
    .cart-summary strong { display: block; font-size: 1.05rem; color: var(--accent-dark); }
    .btn-open-cart {
      border: none;
      background: var(--whatsapp);
      color: #fff;
      font-weight: 700;
      padding: 0.7rem 1.1rem;
      border-radius: 10px;
      font-size: 0.92rem;
      cursor: pointer;
      white-space: nowrap;
    }

    /* Modal del carrito */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      width: 100%;
      max-width: 560px;
      max-height: 86vh;
      border-radius: 18px 18px 0 0;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; padding: 1rem; }
      .modal { border-radius: 16px; max-height: 82vh; }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.65rem;
    }
    .modal-header h2 { font-size: 1.15rem; }
    .btn-close {
      border: none;
      background: #f3f4f6;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 999px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .cart-items {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-right: 0.2rem;
    }
    .cart-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
    }
    .cart-item-info h4 { font-size: 0.95rem; }
    .cart-item-info small { color: var(--muted); display: block; font-size: 0.82rem; }
    .cart-item-sub { font-weight: 700; font-size: 0.92rem; margin-top: 0.2rem; }
    .qty-controls { display: flex; align-items: center; gap: 0.35rem; }
    .qty-btn {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      background: #f9fafb;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
    }
    .qty-val { min-width: 22px; text-align: center; font-size: 0.9rem; font-weight: 600; }
    .btn-remove {
      border: none;
      background: transparent;
      color: var(--danger);
      font-size: 0.85rem;
      cursor: pointer;
      margin-left: 0.25rem;
    }
    .cart-total-box {
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.08rem;
      font-weight: 700;
    }
    .modal-actions { display: flex; gap: 0.6rem; }
    .btn-clear {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--muted);
      padding: 0.72rem 0.9rem;
      border-radius: 10px;
      font-size: 0.88rem;
      cursor: pointer;
    }
    .btn-send-wa {
      flex: 1;
      text-align: center;
      text-decoration: none;
      background: var(--whatsapp);
      color: #fff;
      font-weight: 700;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      font-size: 0.95rem;
    }
    .empty-cart { text-align: center; color: var(--muted); padding: 1.5rem 0.5rem; font-size: 0.92rem; }
  </style>
</head>
<body>
  <header>
    <h1>Hacer Cosmética — Insumos</h1>
    <p>Acumula los insumos y presentaciones que necesites en tu carrito y envía tu pedido completo por WhatsApp.</p>
  </header>

  <main class="container">
    <div class="filters" id="filters"></div>
    <div class="grid" id="catalog"></div>
  </main>

  <div class="toast" id="toast">Agregado al carrito</div>

  <!-- Barra fija inferior del carrito -->
  <div class="cart-bar">
    <div class="cart-bar-inner">
      <div class="cart-summary">
        <span id="bar-count">0 insumos en el carrito</span>
        <strong id="bar-total">Total ref.: $0.00</strong>
      </div>
      <button class="btn-open-cart" onclick="openCart()">Ver carrito y pedir</button>
    </div>
  </div>

  <!-- Ventana del carrito -->
  <div class="modal-backdrop" id="cart-modal" onclick="backdropClose(event)">
    <div class="modal">
      <div class="modal-header">
        <h2>Tu carrito de insumos</h2>
        <button class="btn-close" onclick="closeCart()" aria-label="Cerrar">&times;</button>
      </div>
      <div class="cart-items" id="cart-items"></div>
      <div class="cart-total-box">
        <span>Total de referencia:</span>
        <span id="modal-total">$0.00</span>
      </div>
      <div class="modal-actions">
        <button class="btn-clear" onclick="clearCart()">Vaciar</button>
        <a class="btn-send-wa" id="btn-send-wa" target="_blank" rel="noopener" href="#">
          Pedir por WhatsApp
        </a>
      </div>
    </div>
  </div>

  <script>
    // CAMBIA ESTE NÚMERO POR TU WHATSAPP CON CÓDIGO DE PAÍS (sin + ni espacios, ej: 584120000000)
    const WHATSAPP_NUMBER = "584120000000";

    const PRODUCTS = [
      {
        id: "coco-betaina",
        name: "Coco-betaína",
        category: "Tensioactivos",
        description: "Tensioactivo anfótero suave para shampoos, geles limpiadores y formulaciones capilares o corporales.",
        options: [
          { label: "250 g", price: 5.00 },
          { label: "500 g", price: 9.00 },
          { label: "1 kg", price: 16.50 }
        ]
      },
      {
        id: "niacinamida",
        name: "Niacinamida (Vitamina B3)",
        category: "Activos",
        description: "Activo cosmético hidrosoluble versátil para sérums, cremas faciales y tónicos.",
        options: [
          { label: "50 g", price: 6.50 },
          { label: "100 g", price: 11.50 }
        ]
      },
      {
        id: "goma-xantana",
        name: "Goma Xantana",
        category: "Espesantes y Gomas",
        description: "Biopolímero espesante y estabilizante de fase acuosa para geles, emulsiones y suspensiones.",
        options: [
          { label: "100 g", price: 4.50 },
          { label: "250 g", price: 9.50 }
        ]
      },
      {
        id: "alantoina",
        name: "Alantoína",
        category: "Activos",
        description: "Ingrediente calmante y acondicionador cutáneo ideal para pieles sensibles y post-exposición.",
        options: [
          { label: "50 g", price: 4.00 },
          { label: "100 g", price: 7.20 }
        ]
      }
    ];

    let cart = [];
    let activeCategory = "Todos";
    const categories = ["Todos", ...new Set(PRODUCTS.map(p => p.category))];

    const filtersEl = document.getElementById("filters");
    const catalogEl = document.getElementById("catalog");

    function formatMoney(num) {
      return "$" + Number(num).toFixed(2);
    }

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.textContent = text;
      toast.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function renderFilters() {
      filtersEl.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === activeCategory ? "active" : ""}" onclick="setCategory('${cat}')">
          ${cat}
        </button>
      `).join("");
    }

    window.setCategory = function(cat) {
      activeCategory = cat;
      renderFilters();
      renderCatalog();
    };

    function filteredProducts() {
      return activeCategory === "Todos"
        ? PRODUCTS
        : PRODUCTS.filter(p => p.category === activeCategory);
    }

    window.updateCardPrice = function(idx) {
      const selectEl = document.getElementById(`opt-${idx}`);
      const priceEl = document.getElementById(`price-${idx}`);
      const prod = filteredProducts()[idx];
      const chosen = prod.options[selectEl.selectedIndex];
      priceEl.textContent = formatMoney(chosen.price);
    };

    window.addToCart = function(idx) {
      const selectEl = document.getElementById(`opt-${idx}`);
      const prod = filteredProducts()[idx];
      const chosen = prod.options[selectEl.selectedIndex];
      const key = `${prod.id}__${chosen.label}`;

      const existing = cart.find(item => item.key === key);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({
          key,
          name: prod.name,
          presentation: chosen.label,
          unitPrice: chosen.price,
          qty: 1
        });
      }
      renderCartBar();
      showToast(`Agregado: ${prod.name} (${chosen.label})`);
    };

    function renderCatalog() {
      const list = filteredProducts();
      catalogEl.innerHTML = list.map((prod, idx) => {
        const firstOpt = prod.options[0];
        return `
          <article class="card">
            <div>
              <span class="badge">${prod.category}</span>
              <h3>${prod.name}</h3>
              <p>${prod.description}</p>
            </div>
            <div>
              <label for="opt-${idx}">Presentación</label>
              <select id="opt-${idx}" onchange="updateCardPrice(${idx})">
                ${prod.options.map(o => `<option value="${o.label}">${o.label}</option>`).join("")}
              </select>
              <div class="price-row">
                <span style="font-size:0.85rem;color:#6b6268;">Referencia:</span>
                <span class="price" id="price-${idx}">${formatMoney(firstOpt.price)}</span>
              </div>
              <button class="btn-add" onclick="addToCart(${idx})">Agregar al carrito</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function getCartTotals() {
      const totalItems = cart.reduce((acc, item) => acc + item.qty, 0);
      const totalAmount = cart.reduce((acc, item) => acc + item.unitPrice * item.qty, 0);
      return { totalItems, totalAmount };
    }

    function buildWhatsAppLink() {
      if (cart.length === 0) {
        return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent("Hola Hacer Cosmética, quiero consultar sobre sus insumos.")}`;
      }
      const lines = cart.map((item, i) => {
        const sub = formatMoney(item.unitPrice * item.qty);
        return `${i + 1}. ${item.name} (${item.presentation}) x${item.qty} = ${sub}`;
      });
      const { totalAmount } = getCartTotals();
      const message = [
        "Hola Hacer Cosmética, quisiera realizar el siguiente pedido de insumos:",
        "",
        ...lines,
        "",
        `Total de referencia: ${formatMoney(totalAmount)}`
      ].join("\n");

      return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
    }

    function renderCartBar() {
      const { totalItems, totalAmount } = getCartTotals();
      document.getElementById("bar-count").textContent =
        `${totalItems} ${totalItems === 1 ? "insumo" : "insumos"} en el carrito`;
      document.getElementById("bar-total").textContent = `Total ref.: ${formatMoney(totalAmount)}`;
      document.getElementById("modal-total").textContent = formatMoney(totalAmount);
      document.getElementById("btn-send-wa").href = buildWhatsAppLink();
    }

    function renderCartModal() {
      const container = document.getElementById("cart-items");
      if (cart.length === 0) {
        container.innerHTML = `<div class="empty-cart">Tu carrito está vacío. Agrega algún insumo para armar tu pedido.</div>`;
      } else {
        container.innerHTML = cart.map((item, i) => `
          <div class="cart-item">
            <div class="cart-item-info">
              <h4>${item.name}</h4>
              <small>Presentación: ${item.presentation} · ${formatMoney(item.unitPrice)} c/u</small>
              <div class="cart-item-sub">Subtotal: ${formatMoney(item.unitPrice * item.qty)}</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${i}, -1)">-</button>
              <span class="qty-val">${item.qty}</span>
              <button class="qty-btn" onclick="changeQty(${i}, 1)">+</button>
              <button class="qty-btn" style="color:#dc2626;" onclick="removeItem(${i})" title="Quitar">&times;</button>
            </div>
          </div>
        `).join("");
      }
      renderCartBar();
    }

    window.changeQty = function(index, delta) {
      cart[index].qty += delta;
      if (cart[index].qty <= 0) {
        cart.splice(index, 1);
      }
      renderCartModal();
    };

    window.removeItem = function(index) {
      cart.splice(index, 1);
      renderCartModal();
    };

    window.clearCart = function() {
      cart = [];
      renderCartModal();
    };

    window.openCart = function() {
      renderCartModal();
      document.getElementById("cart-modal").classList.add("open");
    };

    window.closeCart = function() {
      document.getElementById("cart-modal").classList.remove("open");
    };

    window.backdropClose = function(e) {
      if (e.target.id === "cart-modal") closeCart();
    };

    renderFilters();
    renderCatalog();
    renderCartBar();
  </script>
</body>
</html>
